<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Нуарный ночной Нью-Йорк. Детерминированная сцена: window.draw(t) рисует кадр на момент t (секунды).
const W = 1080, H = 1920, DUR = 30;
const DESC0 = 4.5, DESC1 = 8.0;   // камера опускается с неба на улицу
const cv = document.getElementById('c'); let g = cv.getContext('2d');

let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function rr(a, b) { return a + (b - a) * rnd(); }

const PAL = {
  skyTop: '#030406', skyMid: '#0b0f1a', skyLow: '#171c28',
  far: '#141822', mid: '#0a0d14', near: '#030406',
  win: '#dcd8c8', winDim: '#77756c', neon: '#ff1f3d', moon: '#e6e6e0'
};

function layer(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

// Одно здание: силуэт + сетка окон. Окна запоминаем для мигания.
function building(ctx, x, base, bw, bh, color, winP, store, depth, crown) {
  ctx.fillStyle = color;
  ctx.fillRect(x, base - bh, bw, bh);
  ctx.fillStyle = depth === 0 ? 'rgba(150,170,210,0.22)' : depth === 1 ? 'rgba(150,170,210,0.16)' : 'rgba(150,170,210,0.10)';
  ctx.fillRect(x, base - bh, bw, 3); ctx.fillRect(x + bw - 3, base - bh, 3, bh);
  ctx.fillStyle = color;
  if (crown === 'spire') {
    ctx.fillRect(x + bw * 0.3, base - bh - bh * 0.08, bw * 0.4, bh * 0.08);
    ctx.fillRect(x + bw * 0.42, base - bh - bh * 0.16, bw * 0.16, bh * 0.08);
    ctx.beginPath(); ctx.moveTo(x + bw * 0.47, base - bh - bh * 0.16); ctx.lineTo(x + bw * 0.5, base - bh - bh * 0.32);
    ctx.lineTo(x + bw * 0.53, base - bh - bh * 0.16); ctx.fill();
  } else if (crown === 'arc') {
    for (let i = 0; i < 4; i++) {
      const s = bw * (0.9 - i * 0.2);
      ctx.beginPath(); ctx.ellipse(x + bw / 2, base - bh - i * bh * 0.035, s / 2, s * 0.35, 0, Math.PI, 0); ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(x + bw * 0.46, base - bh - bh * 0.12); ctx.lineTo(x + bw * 0.5, base - bh - bh * 0.3);
    ctx.lineTo(x + bw * 0.54, base - bh - bh * 0.12); ctx.fill();
  } else if (crown === 'tank') {
    const tx = x + bw * rr(0.15, 0.55), tw = Math.min(70, bw * 0.3);
    ctx.fillRect(tx + tw * 0.1, base - bh - tw * 0.5, tw * 0.08, tw * 0.5);
    ctx.fillRect(tx + tw * 0.82, base - bh - tw * 0.5, tw * 0.08, tw * 0.5);
    ctx.fillRect(tx, base - bh - tw * 1.3, tw, tw * 0.8);
    ctx.beginPath(); ctx.moveTo(tx - 4, base - bh - tw * 1.3); ctx.lineTo(tx + tw / 2, base - bh - tw * 1.75); ctx.lineTo(tx + tw + 4, base - bh - tw * 1.3); ctx.fill();
  } else if (crown === 'step') {
    ctx.fillRect(x + bw * 0.15, base - bh - bh * 0.1, bw * 0.7, bh * 0.1);
    ctx.fillRect(x + bw * 0.3, base - bh - bh * 0.17, bw * 0.4, bh * 0.07);
  }
  const cw = depth === 0 ? 7 : depth === 1 ? 11 : 16, ch = cw * 1.5, gx = cw * 0.9, gy = ch * 0.8;
  for (let yy = base - bh + ch; yy < base - ch; yy += ch + gy) {
    for (let xx = x + gx; xx < x + bw - cw - gx * 0.5; xx += cw + gx) {
      const r = rnd();
      if (r < winP) {
        const warm = rnd() < 0.85;
        const col = rnd() < 0.07 ? PAL.neon : warm ? (rnd() < 0.7 ? PAL.win : PAL.winDim) : '#a9b4c6';
        store.push({ x: xx, y: yy, w: cw, h: ch, col, ph: rnd() * 100, fl: rnd() < 0.06 });
      }
    }
  }
}

function makeSkyline(depth, count, color, hMin, hMax, wMin, wMax, winP, layerW, crowns, kinds, landmarks) {
  const [c, ctx] = layer(layerW, H);
  const wins = [];
  const base = H * (depth === 0 ? 0.70 : depth === 1 ? 0.80 : 0.92);
  for (const lm of (landmarks || [])) building(ctx, lm.x, base, lm.w, lm.h, color, winP * 0.7, wins, depth, lm.crown);
  let x = -40;
  while (x < layerW) {
    const bw = rr(wMin, wMax), bh = rr(hMin, hMax);
    const cr = rnd() < crowns ? kinds[Math.floor(rnd() * kinds.length)] : null;
    building(ctx, x, base, bw, bh, color, winP, wins, depth, cr);
    x += bw + rr(-10, 18);
  }
  ctx.fillStyle = color; ctx.fillRect(0, base - 2, layerW, H - base + 2);
  return { c, wins, base };
}

const L0 = makeSkyline(0, 0, PAL.far, 250, 620, 70, 150, 0.07, 1700, 0.3, ['step', 'tank'],
  [{ x: 640, w: 150, h: 980, crown: 'spire' }, { x: 1010, w: 120, h: 860, crown: 'arc' }]);
const L1 = makeSkyline(1, 0, PAL.mid, 330, 820, 110, 220, 0.09, 1900, 0.45, ['tank', 'step', 'tank']);
const L2 = makeSkyline(2, 0, PAL.near, 120, 460, 180, 360, 0.05, 2200, 0.7, ['tank', 'tank', 'step']);

// Неоновая вывеска на среднем плане
const neon = { x: 980, y: H * 0.80 - 640 };

// Облака: размытые овалы
const [cloudC, cctx] = layer(2400, 900);
cctx.filter = 'blur(28px)';
for (let i = 0; i < 26; i++) {
  cctx.fillStyle = `rgba(${rr(45, 65)},${rr(48, 68)},${rr(60, 82)},${rr(0.25, 0.5)})`;
  cctx.beginPath(); cctx.ellipse(rr(0, 2400), rr(80, 820), rr(160, 420), rr(30, 80), 0, 0, Math.PI * 2); cctx.fill();
}
cctx.filter = 'none';

// Дождь: три плана
const rain = [];
for (let i = 0; i < 900; i++) {
  const d = rnd();
  rain.push({ x: rr(-200, W + 200), y: rr(0, H), len: 18 + d * 60, sp: 900 + d * 1700, a: 0.08 + d * 0.28, w: 0.6 + d * 1.6 });
}

// Зерно: заранее несколько кадров шума
const grains = [];
for (let k = 0; k < 6; k++) {
  const [gc, gg] = layer(540, 960);
  const id = gg.createImageData(540, 960);
  for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
  gg.putImageData(id, 0, 0); grains.push(gc);
}

function ease(t) { return t * t * (3 - 2 * t); }

function drawWins(L, ox, t, dim) {
  for (const w of L.wins) {
    let on = 1;
    if (w.fl) on = (Math.sin(t * 2.3 + w.ph) > 0.2) ? 1 : 0.15;
    else if (Math.sin(t * 0.35 + w.ph) > 0.985) on = 0;
    g.globalAlpha = on * dim;
    g.fillStyle = w.col;
    g.fillRect(w.x - ox, w.y, w.w, w.h);
  }
  g.globalAlpha = 1;
}

function drawSky(t) {
  const p = ease(Math.min(1, t / DESC1));
  // небо
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, PAL.skyTop); sky.addColorStop(0.45, PAL.skyMid); sky.addColorStop(0.75, PAL.skyLow); sky.addColorStop(1, '#0a0f1c');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  // луна с ореолом
  const mx = 760 - p * 60, my = 430;
  const halo = g.createRadialGradient(mx, my, 60, mx, my, 520);
  halo.addColorStop(0, 'rgba(233,228,210,0.35)'); halo.addColorStop(1, 'rgba(233,228,210,0)');
  g.fillStyle = halo; g.fillRect(0, 0, W, H);
  g.fillStyle = PAL.moon; g.beginPath(); g.arc(mx, my, 120, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(160,150,130,0.25)';
  g.beginPath(); g.arc(mx - 35, my - 20, 26, 0, 7); g.arc(mx + 30, my + 35, 18, 0, 7); g.arc(mx + 10, my - 50, 12, 0, 7); g.fill();

  // прожекторы
  for (let i = 0; i < 2; i++) {
    const bx = 250 + i * 520 - p * 80, by = H * 0.72;
    const ang = -Math.PI / 2 + Math.sin(t * 0.45 + i * 2.1) * 0.45;
    g.save(); g.translate(bx, by); g.rotate(ang);
    const bg = g.createLinearGradient(0, 0, 1500, 0);
    bg.addColorStop(0, 'rgba(200,215,255,0.20)'); bg.addColorStop(1, 'rgba(200,215,255,0)');
    g.fillStyle = bg; g.beginPath(); g.moveTo(0, -6); g.lineTo(1500, -110); g.lineTo(1500, 110); g.lineTo(0, 6); g.fill();
    g.restore();
  }

  // облака
  g.globalAlpha = 0.9;
  g.drawImage(cloudC, -200 - t * 14, 120);
  g.globalAlpha = 1;

  // дальний план
  const o0 = 120 + p * 140, o1 = 160 + p * 300, o2 = 200 + p * 560;
  g.drawImage(L0.c, -o0, 0); drawWins(L0, o0, t, 0.55);
  // туман между планами
  let fog = g.createLinearGradient(0, H * 0.55, 0, H * 0.78);
  fog.addColorStop(0, 'rgba(70,72,85,0)'); fog.addColorStop(1, 'rgba(70,72,85,0.3)');
  g.fillStyle = fog; g.fillRect(0, H * 0.55, W, H * 0.25);

  g.drawImage(L1.c, -o1, 0); drawWins(L1, o1, t, 0.85);

  // неон: вертикальная вывеска HOTEL
  const nf = (Math.sin(t * 9) > -0.6 && !(t % 4 > 2.6 && t % 4 < 2.75)) ? 1 : 0.25;
  const nx = neon.x - o1, ny = neon.y;
  if (nx > -80 && nx < W + 80) {
    g.save();
    g.shadowColor = PAL.neon; g.shadowBlur = 40 * nf;
    g.strokeStyle = `rgba(255,45,74,${0.95 * nf})`; g.lineWidth = 5;
    g.strokeRect(nx, ny, 70, 330);
    g.fillStyle = `rgba(255,70,95,${nf})`; g.font = 'bold 54px Georgia, serif'; g.textAlign = 'center';
    'HOTEL'.split('').forEach((ch, i) => g.fillText(ch, nx + 35, ny + 66 + i * 60));
    g.restore();
    const glow = g.createRadialGradient(nx + 35, ny + 165, 10, nx + 35, ny + 165, 320);
    glow.addColorStop(0, `rgba(255,45,74,${0.18 * nf})`); glow.addColorStop(1, 'rgba(255,45,74,0)');
    g.fillStyle = glow; g.fillRect(nx - 300, ny - 160, 670, 650);
  }

  fog = g.createLinearGradient(0, H * 0.7, 0, H * 0.9);
  fog.addColorStop(0, 'rgba(60,20,28,0)'); fog.addColorStop(1, 'rgba(60,20,28,0.35)');
  g.fillStyle = fog; g.fillRect(0, H * 0.7, W, H * 0.2);

  // ближний план
  g.drawImage(L2.c, -o2, 0); drawWins(L2, o2, t, 1.0);

}


// ---------------- УЛИЦА ----------------
const SW_ = 1700;                       // ширина уличного слоя
const ST = { side: 1250, curb: 1340 };  // тротуар и бордюр (локальные координаты кадра улицы)
const [facC, fx] = layer(SW_, ST.side + 10);
const facWins = [];
(function buildFacades() {
  const cols = ['#0b0c10', '#08090d', '#0d0e13', '#07080b'];
  let x = -20, k = 0;
  while (x < SW_) {
    const bw = rr(300, 460), col = cols[k++ % cols.length];
    fx.fillStyle = col; fx.fillRect(x, 0, bw, ST.side + 10);
    // карниз и межэтажные линии
    fx.fillStyle = 'rgba(140,160,200,0.07)';
    for (let yy = 120; yy < 820; yy += 175) fx.fillRect(x, yy, bw, 4);
    fx.fillStyle = 'rgba(150,170,210,0.12)'; fx.fillRect(x + bw - 3, 0, 3, ST.side);
    // окна верхних этажей
    for (let yy = 150; yy < 780; yy += 175) for (let xx = x + 40; xx < x + bw - 90; xx += 105) {
      fx.fillStyle = '#05070d'; fx.fillRect(xx, yy, 58, 100);
      if (rnd() < 0.16) facWins.push({ x: xx + 4, y: yy + 4, w: 50, h: 92, col: rnd() < 0.25 ? '#c4182f' : '#c9c5b8', ph: rnd() * 50 });
    }
    // пожарная лестница
    if (rnd() < 0.7) {
      fx.strokeStyle = '#1d2333'; fx.lineWidth = 4;
      const lx = x + bw * 0.25, lw = bw * 0.5;
      for (let yy = 260; yy < 800; yy += 175) {
        fx.strokeRect(lx, yy, lw, 2);
        for (let r = lx; r < lx + lw; r += 14) { fx.beginPath(); fx.moveTo(r, yy); fx.lineTo(r, yy - 34); fx.stroke(); }
        fx.beginPath(); fx.moveTo(lx, yy - 34); fx.lineTo(lx + lw, yy - 34); fx.stroke();
        fx.beginPath(); fx.moveTo(lx + lw * 0.2, yy); fx.lineTo(lx + lw * 0.75, yy + 175 - 34); fx.stroke();
      }
    }
    x += bw;
  }
})();

// Витрины первого этажа: закусочная, бар, подъезд
const shops = [
  { x: 150, w: 520, kind: 'diner' },
  { x: 760, w: 300, kind: 'laundry' },
  { x: 1150, w: 420, kind: 'bar' }
];
function drawShops(t) {
  for (const s of shops) {
    const top = 900, bot = ST.side - 10;
    if (s.kind === 'diner') {
      const fl = 0.92 + 0.08 * Math.sin(t * 13);
      const gr = g.createLinearGradient(0, top, 0, bot);
      gr.addColorStop(0, `rgba(200,198,185,${0.75 * fl})`); gr.addColorStop(1, `rgba(120,118,110,${0.7 * fl})`);
      g.fillStyle = gr; g.fillRect(s.x, top, s.w, bot - top);
      drawDinerInterior(s, top, bot, t);
      g.fillStyle = '#05070c'; g.fillRect(s.x + s.w / 2 - 3, top, 6, bot - top);  // переплёт
      // дверь закусочной: открывается, изнутри падает свет
      const dx0 = DOOR_X - 32, op = doorOpen(t);
      g.fillStyle = `rgba(220,215,195,${0.25 + 0.6 * op})`; g.fillRect(dx0, top - 20, 64, bot - top + 20);
      const lg = g.createLinearGradient(0, bot, 0, bot + 110); lg.addColorStop(0, `rgba(230,225,205,${0.35 * op})`); lg.addColorStop(1, 'rgba(230,225,205,0)');
      g.fillStyle = lg; g.beginPath(); g.moveTo(dx0, bot); g.lineTo(dx0 + 64, bot); g.lineTo(dx0 + 130, bot + 110); g.lineTo(dx0 - 40, bot + 110); g.fill();

      // маркиза
      for (let i = 0; i < 9; i++) { g.fillStyle = i % 2 ? '#3a0d16' : '#1a0509'; g.fillRect(s.x - 20 + i * (s.w + 40) / 9, top - 70, (s.w + 40) / 9 + 1, 60); }
      neonText('DINER', s.x + s.w / 2, top - 120, 70, '#ff1f3d', t, 3.1);
    } else if (s.kind === 'laundry') {
      // прачечная: холодный белый свет, машины в ряд, вывеска холодным неоном
      const fl = 0.95 + 0.05 * Math.sin(t * 11 + 1);
      const gr = g.createLinearGradient(0, top, 0, bot);
      gr.addColorStop(0, `rgba(205,212,222,${0.72 * fl})`); gr.addColorStop(1, `rgba(120,126,138,${0.65 * fl})`);
      g.fillStyle = gr; g.fillRect(s.x, top + 30, s.w, bot - top - 30);
      g.fillStyle = 'rgba(12,12,15,0.85)';
      for (let i = 0; i < 4; i++) { const mx = s.x + 22 + i * 70; g.fillRect(mx, bot - 120, 58, 120); }
      g.fillStyle = 'rgba(190,198,210,0.35)';
      for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(s.x + 51 + i * 70, bot - 62, 18, 0, 7); g.fill(); }
      g.fillStyle = '#05070c'; g.fillRect(s.x + s.w / 2 - 3, top + 30, 6, bot - top - 30);
      neonText('LAUNDRY', s.x + s.w / 2, top - 10, 46, '#dfe6f2', t, 4.4);
    } else if (s.kind === 'bar') {
      g.fillStyle = '#1a0b10'; g.fillRect(s.x, top, s.w, bot - top);
      const gr = g.createRadialGradient(s.x + s.w / 2, bot - 120, 20, s.x + s.w / 2, bot - 120, 260);
      gr.addColorStop(0, 'rgba(255,60,90,0.55)'); gr.addColorStop(1, 'rgba(255,60,90,0.05)');
      g.fillStyle = gr; g.fillRect(s.x, top, s.w, bot - top);
      g.fillStyle = '#05070c'; for (let i = 1; i < 4; i++) g.fillRect(s.x + i * s.w / 4 - 2, top, 4, bot - top);
      neonText('BAR', s.x + s.w / 2, top - 70, 90, '#ff2d4a', t, 1.7);
    } else {
      g.fillStyle = '#05070c'; g.fillRect(s.x, top + 40, s.w, bot - top - 40);
      const gr = g.createLinearGradient(0, top + 40, 0, bot);
      gr.addColorStop(0, 'rgba(255,40,60,0.35)'); gr.addColorStop(1, 'rgba(255,40,60,0.05)');
      g.fillStyle = gr; g.fillRect(s.x + 30, top + 70, s.w - 60, bot - top - 70);
      g.fillStyle = 'rgba(255,60,80,0.95)'; g.beginPath(); g.arc(s.x + s.w / 2, top + 20, 10, 0, 7); g.fill();
    }
  }
  // вертикальная вывеска HOTEL на фасаде и VACANCY под ней
  neonVertical('HOTEL', 1095, 320, t);
  neonText('VACANCY', 1140, 790, 40, '#ff1f3d', t, 2.2);
  // окно с жалюзи в красном свете, в нём появляется силуэт женщины
  const bx = 560, by = 210, bw = 200, bh = 300, wa = Math.min(1, Math.max(0, (t - 15) / 1.2));
  g.fillStyle = `rgba(200,20,40,${0.25 + 0.6 * wa})`; g.fillRect(bx, by, bw, bh);
  if (wa > 0) {
    g.fillStyle = `rgba(5,3,5,${0.95 * wa})`;
    const sx = bx + 110 + Math.sin(t * 0.6) * 6;
    g.beginPath(); g.arc(sx, by + 95, 24, 0, 7); g.fill();
    g.beginPath(); g.ellipse(sx, by + 70, 30, 30, 0, Math.PI, 0); g.fill();
    g.beginPath(); g.moveTo(sx - 18, by + 118); g.lineTo(sx + 18, by + 118); g.lineTo(sx + 46, by + bh); g.lineTo(sx - 46, by + bh); g.fill();
  }
  g.fillStyle = '#050407'; for (let yy = by + 8; yy < by + bh; yy += 16) g.fillRect(bx, yy, bw, 7);
  g.strokeStyle = '#050407'; g.lineWidth = 8; g.strokeRect(bx, by, bw, bh);
  // свет из окна вниз по фасаду полосами
  const gl = g.createRadialGradient(bx + bw / 2, by + bh / 2, 40, bx + bw / 2, by + bh / 2, 340);
  gl.addColorStop(0, `rgba(220,20,45,${0.10 + 0.14 * wa})`); gl.addColorStop(1, 'rgba(220,20,45,0)');
  g.fillStyle = gl; g.fillRect(bx - 250, by - 250, bw + 500, bh + 500);
  // светофор на углу: красный
  const tx = 1580;
  g.fillStyle = '#040407'; g.fillRect(tx, 640, 16, ST.side - 640 + 20); g.fillRect(tx - 22, 560, 60, 150);
  const on = 0.85 + 0.15 * Math.sin(t * 2);
  const rg = g.createRadialGradient(tx + 8, 590, 2, tx + 8, 590, 120);
  rg.addColorStop(0, `rgba(255,30,50,${on})`); rg.addColorStop(0.15, `rgba(255,30,50,${0.5 * on})`); rg.addColorStop(1, 'rgba(255,30,50,0)');
  g.fillStyle = rg; g.fillRect(tx - 112, 470, 240, 240);
}
function neonOn(t, sh) { return (Math.sin(t * 9 + sh) > -0.7 && !((t + sh) % 5 > 3.1 && (t + sh) % 5 < 3.25)) ? 1 : 0.2; }
function neonText(txt, cx, cy, size, col, t, sh) {
  const on = neonOn(t, sh);
  g.save(); g.font = `bold ${size}px Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = col; g.shadowBlur = 45 * on; g.globalAlpha = 0.25 + 0.75 * on; g.fillStyle = col; g.fillText(txt, cx, cy);
  g.shadowBlur = 0; g.globalAlpha = on; g.fillStyle = '#ffffff'; g.globalAlpha = 0.35 * on; g.fillText(txt, cx, cy);
  g.restore();
}
function neonVertical(txt, x, y, t) {
  const on = neonOn(t, 0.4);
  g.save(); g.shadowColor = PAL.neon; g.shadowBlur = 40 * on;
  g.strokeStyle = `rgba(255,45,74,${0.95 * on})`; g.lineWidth = 6; g.strokeRect(x, y, 90, 420);
  g.fillStyle = `rgba(255,70,95,${on})`; g.font = 'bold 68px Georgia, serif'; g.textAlign = 'center';
  txt.split('').forEach((ch, i) => g.fillText(ch, x + 45, y + 82 + i * 78));
  g.restore();
}

// Фонари (локальные координаты слоя)
const lamps = [{ x: 470 }, { x: 1330 }];
function drawLampPosts() {
  for (const l of lamps) {
    g.fillStyle = '#04050a';
    g.fillRect(l.x - 9, 560, 18, ST.side + 20 - 560);

// --- трамвай: стоит у остановки, двери закрываются, плавно уходит вправо
const TRAM = { x: 640, len: 1060, bottom: 1850, h: 500, go: 12.9 };
function tramShift(t) { const u = Math.max(0, t - TRAM.go); const v = Math.min(360, 70 * u); return u < 360 / 70 ? 35 * u * u : (360 * 360 / 140) + 360 * (u - 360 / 70); }

  g.fillStyle = hb; g.beginPath(); g.moveTo(x0 + L + 10, y1 - 90); g.lineTo(x0 + L + 600, y1 - 200); g.lineTo(x0 + L + 600, y1 + 30); g.lineTo(x0 + L + 10, y1 - 60); g.fill();

// Всё, что выше бордюра (фасады, витрины, фонари, люди), рисуется в отдельный буфер: из него же отражение в асфальте

function camOX(t) { return 90 + Math.max(0, t - DESC0) * 6; }
