      <stop offset="0%" stop-color="#7A5A28"/><stop offset="18%" stop-color="#E4C687"/>
      <stop offset="34%" stop-color="#B58E45"/><stop offset="52%" stop-color="#F3E2B4"/>
      <stop offset="68%" stop-color="#C09A50"/><stop offset="86%" stop-color="#E8CE93"/>
      <stop offset="100%" stop-color="#8A6730"/></linearGradient>
    <linearGradient id="foilRule" x1="0" y1="0" x2="1" y2="0">
