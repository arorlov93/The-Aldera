ont-weight="normal">≈ 9-10 filled</text><text x="252.0" y="82" font-size="3.6" fill="#111" text-anchor="middle" font-weight="bold">SECTION A-A</text><path d="M222,97.5 L228,97.5 C232,84.96 272,84.96 276,97.5 L282,97.5 M228,97.5 C232,110.04 272,110.04 276,97.5" fill="#FBF7F0" stroke="#C0143C" stroke-width=".4"/><circle cx="243.0" cy="97.5" r="8.5" fill="#fff" stroke="#999" stroke-width=".3"/><circle cx="261.0" cy="97.5" r="8.5" fill="#fff" stroke="#999" stroke-width=".3"/><line x1="222" y1="116.0" x2="282" y2="116.0" stroke="#555" stroke-width="0.2" /><line x1="222" y1="114.5" x2="222" y2="117.5" stroke="#555" stroke-width="0.2" /><line x1="282" y1="114.5" x2="282" y2="117.5" stroke="#555" stroke-width="0.2" /><text x="252.0" y="114.8" font-size="2.8" fill="#555" text-anchor="middle" font-weight="normal">30</text><text x="20" y="16" font-size="5.2" fill="#111" text-anchor="start" font-weight="bold">THE ALDERA · Day Pass sachet · shape drawing · scale 2:1</text><text x="20" y="25" font-size="3.2" fill="#333" text-anchor="start" font-weight="normal">Finished size 30 x 50 mm, flat 3-side seal (fin seal on sides, top seal after filling) · serrated cut top and bottom</text><text x="20" y="31" font-size="3.2" fill="#333" text-anchor="start" font-weight="normal">Seals: sides 3 mm, top 6 mm, bottom 5 mm · inner pocket 24 x 39 mm · tear notches both sides, 9 mm from top</text><text x="20" y="37" font-size="3.2" fill="#333" text-anchor="start" font-weight="normal">Contents: 2 capsules size 00 (23.3 x 8.5 mm) · filled thickness about 9-10 mm · capsules lie side by side or stacked</text><text x="20" y="43" font-size="3.2" fill="#333" text-anchor="start" font-weight="normal">Laminate: matte PET 12 / AL foil 7 / PE 50 µm (moisture barrier) · print both sides · LOT / EXP printed on the back</text><line x1="20" y1="55" x2="30" y2="55" stroke="#C0143C" stroke-width="0.7" /><text x="33" y="56.2" font-size="3" fill="#333" text-anchor="start" font-weight="normal">cut / outline</text><line x1="82" y1="55" x2="92" y2="55" stroke="#bbb" stroke-width="2.2" /><text x="95" y="56.2" font-size="3" fill="#333" text-anchor="start" font-weight="normal">grey: seal zone, no small text</text><line x1="144" y1="55" x2="154" y2="55" stroke="#2E8B57" stroke-width="0.7" stroke-dasharray="1.2 0.8"/><text x="157" y="56.2" font-size="3" fill="#333" text-anchor="start" font-weight="normal">safe area for text</text><line x1="206" y1="55" x2="216" y2="55" stroke="#555" stroke-width="0.7" stroke-dasharray="1.2 0.8"/><text x="219" y="56.2" font-size="3" fill="#333" text-anchor="start" font-weight="normal">tear line</text><text x="20" y="205" font-size="3" fill="#333" text-anchor="start" font-weight="normal">Capsule check: two size 00 capsules need about 44 mm of film around them; the 24 mm pocket gives 48 mm. Size 0 capsules fit with more room.</text></svg>